name: OCEAN CLOUD two-tenant backend
on:
  pull_request:
  push:
    branches:
      - 'feat/ocean-cloud-saas-control-plane-20261107'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-postgres-tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-db-owner-only
          POSTGRES_DB: ocean_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ocean_cloud"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      OCEAN_SIGNUP_ENABLED: 'true'
      OCEAN_MIGRATION_DATABASE_URL: postgresql://postgres:ci-db-owner-only@127.0.0.1:5432/ocean_cloud
      OCEAN_DATABASE_URL: postgresql://ocean_app:ci-only-password-no-production-use@127.0.0.1:5432/ocean_cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability release gate
        run: npm audit --audit-level=high
      - name: TypeScript compile and type checks
        run: npm run build
      - name: Create restricted non-owner DB role (CI only)
        run: node --import tsx scripts/ci-db-setup.ts
      - name: Install PostgreSQL tables and FORCE RLS
        run: npm run db:migrate
      - name: Exercise real two-tenant HTTP workflows and PostgreSQL RLS
        run: npm test
      - name: Build locked staging Docker image (no deployment)
        run: docker build --pull --tag ocean-cloud:ci .
